# Eval 1 (evals/opencode/evals.json): single delegation, no unasked landing.
# Needs, in the environment of `cowork-harness run` (see ../run.sh):
#   OPENCODE_DELEGATE_HOME=/private/tmp/ocd-harness/<name>  (NOT under /var/folders)
#   OPENCODE_DELEGATE_PORT=4098                             (never 4096)
#   CLAUDE_CODE_OAUTH_TOKEN                                  (gives a managed, clean Claude config dir)
# A scenario cannot set agent env vars: `agent_env` accepts only a fixed set of knobs, and at
# `protocol` the agent inherits the operator's shell env, which is how the two OPENCODE_* vars arrive.
name: opencode-add-sub
baseline: latest
session: ../sessions/opencode.yaml
fidelity: protocol
allow_host_hooks: true      # the plugin declares hooks/hooks.json; at protocol they run as host processes
on_unanswered: fail
timeout_ms: 1800000

workspace_fixture: ../fixtures/add-sub

prompt: |
  /opencode-delegate:opencode add a sub(a, b) function next to add() in math.js and make sure it's exported

  Test setup, do this first and do not mention it again: the project files are under outputs/ (paths in the request are relative to it); never search outside this directory. this directory is not a git repository yet, so run
  exactly this one command: git init -q && git add -A && git -c user.name=fixture -c user.email=fixture@example.com commit -qm "fixture baseline"

answers:
  # Any question (e.g. "commit opencode.json?", "land it?"): decline. Free text bypasses label validation.
  - when_question: ".*"
    answer: "No. Do not commit, apply or land anything yet. Leave everything uncommitted and report back."
  # Scripted Bash policy: keeps the run off the permissive_auto_allow path and denies the dangerous shapes.
  - when_tool: Bash
    allow_if: '!/\bgit\s+push\b|--unsafe-policy|--dangerously-skip-permissions|\bremove\b[^\n]*--force|\bgit\s+(checkout|restore)\s+\.|\bgit\s+reset\s+--hard/.test(command)'
    else: deny
  - when_tool: Write
    decide: allow
  - when_tool: Edit
    decide: allow

assert:
  # --- both lanes (content keys, survive replay) ---
  - result: success
  - skill_triggered: "opencode-delegate:opencode"
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\srun\s[\s\S]*--task\s+[a-z0-9]+(-[a-z0-9]+)*'}}
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\sinit\s'}}
  # No worktree-path check: the redaction policy rewrites host paths, so it could never match on replay;
  # the task branch (transcript_matches below) is the evidence instead.
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\sdiff\s'}}
  - tool_not_called: {tool: Bash, input: {command: 'git\s+push'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\bfind\s+/(\s|$)'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\.local/state/opencode-delegate'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '--unsafe-policy'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '--dangerously-skip-permissions'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: 'remove\b[^\n]*--force'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '(^|[;&|(]\s*)opencode\s+(run|serve)\b'}, scope: any}
  # not landed and not committed unasked (the setup commit is exempt; --check dry-runs are fine)
  - tool_not_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\s(apply|land)\b(?![^\n]*--check)'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\bgit\b[^\n]*\bcommit\b(?![^\n]*fixture baseline)'}, scope: any}
  - transcript_matches: 'opencode/[a-z0-9-]+|refs/opencode-delegate/tasks/'
  - max_cost_usd: 8
  # --- live only ---
  - input_unmodified: ["outputs/math.js", "outputs/package.json"]
