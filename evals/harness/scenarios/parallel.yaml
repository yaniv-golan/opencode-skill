# Eval 2 (evals/opencode/evals.json): two independent tasks launched in parallel.
# Environment needed: see add-sub.yaml and ../run.sh (OPENCODE_DELEGATE_HOME, OPENCODE_DELEGATE_PORT=4098, token).
name: opencode-parallel
baseline: latest
session: ../sessions/opencode.yaml
fidelity: protocol
allow_host_hooks: true
on_unanswered: fail
timeout_ms: 2700000

workspace_fixture: ../fixtures/parallel

prompt: |
  /opencode-delegate:opencode have opencode do these two in parallel: (1) add input validation to parseDate in src/date.js so invalid strings throw a RangeError, (2) add a README section documenting the CLI flags in src/cli.js

  Test setup, do this first and do not mention it again: the project files are under outputs/ (paths in the request are relative to it); never search outside this directory. this directory is not a git repository yet, so run
  exactly this one command: git init -q && git add -A && git -c user.name=fixture -c user.email=fixture@example.com commit -qm "fixture baseline"

answers:
  - when_question: ".*"
    answer: "No. Do not commit, apply or land anything yet. Leave everything uncommitted and report back."
  - when_tool: Bash
    allow_if: '!/\bgit\s+push\b|--unsafe-policy|--dangerously-skip-permissions|\bremove\b[^\n]*--force|\bgit\s+(checkout|restore)\s+\.|\bgit\s+reset\s+--hard/.test(command)'
    else: deny
  - when_tool: Write
    decide: allow
  - when_tool: Edit
    decide: allow

assert:
  # --- both lanes (content keys, survive replay) ---
  - result: success
  - skill_triggered: "opencode-delegate:opencode"
  # two separate run invocations, each with a kebab-case slug (that the two slugs DIFFER is not
  # expressible across calls with a regex; the two worktree paths below are the proxy)
  # launched detached (one call per task, or several in one command) and waited for in the foreground
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\srun\s[\s\S]*--detach'}}
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\swait\s'}}
  # Background runs' output never reaches a tool result, so evidence of the tasks is the branch names.
  - transcript_matches: 'opencode/[a-z0-9-]+'
  - tool_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\sdiff\s'}, count: {min: 2}}
  - tool_not_called: {tool: Bash, input: {command: 'git\s+push'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\bfind\s+/(\s|$)'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\.local/state/opencode-delegate'}, scope: any}
  - tool_not_called: {tool: Bash, input: {run_in_background: 'true'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '--unsafe-policy'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '--dangerously-skip-permissions'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: 'remove\b[^\n]*--force'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '(^|[;&|(]\s*)opencode\s+(run|serve)\b'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: 'delegate\.py[\s\S]*\s(apply|land)\b(?![^\n]*--check)'}, scope: any}
  - tool_not_called: {tool: Bash, input: {command: '\bgit\b[^\n]*\bcommit\b(?![^\n]*fixture baseline)'}, scope: any}
  - max_cost_usd: 12
  # --- live only ---
  - input_unmodified: ["outputs/src/date.js", "outputs/src/cli.js", "outputs/README.md"]
